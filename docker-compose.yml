services:
  guardrail-mesh-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: guardrail-mesh-web:scif
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-guardrail}:${POSTGRES_PASSWORD:-postgres_ci_password_123}@guardrail-mesh-db:5432/${POSTGRES_DB:-guardrail}"
      REDIS_URL: "redis://guardrail-mesh-cache:6379"
      DRIFT_MONITOR_URL: "http://guardrail-mesh-drift:8000"
      DRIFT_WEBHOOK_SECRET: "${DRIFT_WEBHOOK_SECRET:-ci_drift_secret_12345}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MESH_AUTH_TOKEN_SECRET: "${MESH_AUTH_TOKEN_SECRET:-ci_mesh_auth_secret_must_be_32_chars}"
      GITHUB_ACTIONS: "${GITHUB_ACTIONS:-false}"
    depends_on:
      guardrail-mesh-db:
        condition: service_healthy
      guardrail-mesh-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - guardrail-mesh

  guardrail-mesh-drift:
    build:
      context: ./services/drift-monitor
      dockerfile: Dockerfile
    image: guardrail-mesh-drift:scif
    environment:
      DRIFT_WEBHOOK_URL: "http://guardrail-mesh-web:3000/api/webhooks/drift"
      DRIFT_WEBHOOK_SECRET: "${DRIFT_WEBHOOK_SECRET:-ci_drift_secret_12345}"
      DRIFT_WEBHOOK_TIMEOUT_SECONDS: "5"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      guardrail-mesh-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - guardrail-mesh

  guardrail-mesh-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-guardrail}"
      POSTGRES_USER: "${POSTGRES_USER:-guardrail}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_ci_password_123}"
    volumes:
      - guardrail_mesh_postgres:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./supabase/migrations/001_add_telemetry_columns.sql:/docker-entrypoint-initdb.d/010-telemetry.sql:ro
      - ./supabase/migrations/002_mesh_zero_days.sql:/docker-entrypoint-initdb.d/020-mesh-zero-days.sql:ro
      - ./supabase/migrations/003_compliance_engine.sql:/docker-entrypoint-initdb.d/030-compliance.sql:ro
      - ./supabase/migrations/003_mesh_dataset_versions.sql:/docker-entrypoint-initdb.d/031-mesh-dataset-versions.sql:ro
      - ./supabase/migrations/004_phase9_modality.sql:/docker-entrypoint-initdb.d/040-phase9-modality.sql:ro
      - ./supabase/migrations/005_sovereign_index.sql:/docker-entrypoint-initdb.d/050-sovereign-index.sql:ro
      - ./supabase/migrations/006_evolutionary_art.sql:/docker-entrypoint-initdb.d/060-evolutionary-art.sql:ro
      - ./supabase/migrations/007_drift_monitoring.sql:/docker-entrypoint-initdb.d/070-drift-monitoring.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail -d guardrail"]
      interval: 3s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - guardrail-mesh

  guardrail-mesh-cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - guardrail_mesh_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - guardrail-mesh

networks:
  guardrail-mesh:

volumes:
  guardrail_mesh_postgres:
  guardrail_mesh_redis:
