name: Nightly Red-Team Replay

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  redteam-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloud Credentials
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "❌ CRITICAL: DATABASE_URL is missing from GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "❌ CRITICAL: GEMINI_API_KEY is missing from GitHub Repository Secrets."
            exit 1
          fi
          echo "✅ Production cloud configurations successfully loaded."

      - name: Verify Database Schema
        run: npm run db:check-schema

      - name: Seed adversarial prompts
        run: npm run seed:prompts

      - name: Run red-team harness
        run: npm run redteam:run
