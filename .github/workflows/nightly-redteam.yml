name: Nightly Red-Team Replay

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  redteam-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloud Credentials
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ CRITICAL: DATABASE_URL is missing from GitHub Repository Secrets."
            echo "   → Go to Settings > Secrets and variables > Actions and add DATABASE_URL."
            exit 1
          fi
          if ! echo "$DATABASE_URL" | grep -qE '^postgres(ql)?://'; then
            echo "❌ CRITICAL: DATABASE_URL is not a valid PostgreSQL connection string."
            echo "   → Expected format: postgresql://user:password@host:5432/dbname"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ CRITICAL: GEMINI_API_KEY is missing from GitHub Repository Secrets."
            exit 1
          fi
          echo "✅ Production cloud configurations successfully loaded."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify Database Schema
        run: npm run db:check-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed adversarial prompts
        run: npm run seed:prompts

      - name: Run red-team harness
        run: npm run redteam:run
