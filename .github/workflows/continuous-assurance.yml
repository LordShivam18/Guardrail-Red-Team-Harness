name: Continuous Assurance Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-swarm-mesh:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: "postgres_ci_password_123"
      DRIFT_WEBHOOK_SECRET: "ci_drift_secret_12345"
      DRIFT_MONITOR_API_TOKEN: "ci_drift_monitor_api_token_12345"
      MESH_AUTH_TOKEN_SECRET: "ci_mesh_auth_secret_must_be_32_chars"
      MESH_AUTH_ISSUER: "https://identity.example.gov"
      MESH_AUTH_AUDIENCE: "guardrail-mesh-operator"
      CI: "true"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Node Unit & Integration Tests
        run: npm test

      - name: Install Python Dependencies
        run: pip install -r services/drift-monitor/requirements.txt PyJWT requests httpx

      - name: Python Import Smoke Test
        run: python -c "import sys; sys.path.insert(0, 'services/drift-monitor'); import main; print('drift import ok')"

      - name: Run Python Unit Tests
        run: npm run test:python

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Start Docker Services
        run: |
          if ! docker compose up -d --build; then
            docker compose ps -a
            docker compose logs --no-color guardrail-mesh-drift
            container_id="$(docker compose ps -q guardrail-mesh-drift)"
            if [ -n "$container_id" ]; then
              docker inspect "$container_id" \
                --format='exit={{.State.ExitCode}} error={{.State.Error}}'
            fi
            exit 1
          fi
        env:
          POSTGRES_PASSWORD: "postgres_ci_password_123"
          DRIFT_WEBHOOK_SECRET: "ci_drift_secret_12345"
          DRIFT_MONITOR_API_TOKEN: "ci_drift_monitor_api_token_12345"
          MESH_AUTH_TOKEN_SECRET: "ci_mesh_auth_secret_must_be_32_chars"
          MESH_AUTH_ISSUER: "https://identity.example.gov"
          MESH_AUTH_AUDIENCE: "guardrail-mesh-operator"
          CI: "true"
          GITHUB_ACTIONS: "true"

      - name: Verify Docker Containers
        if: always()
        run: docker compose ps

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to accept connections..."
          for i in $(seq 1 30); do
            if docker compose exec -T guardrail-mesh-db pg_isready -U guardrail -d guardrail 2>/dev/null; then
              echo "[OK] PostgreSQL is healthy (attempt $i/30)"
              exit 0
            fi
            echo "Attempt $i/30: PostgreSQL not ready, retrying in 2s..."
            sleep 2
          done
          echo "❌ ERROR: PostgreSQL failed to become ready within 60s."
          docker compose ps
          docker compose logs guardrail-mesh-db
          exit 1

      - name: Verify Database Schema
        run: npm run db:verify-schema
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGUSER: "guardrail"
          PGPASSWORD: "postgres_ci_password_123"
          PGDATABASE: "guardrail"
          DATABASE_URL: "postgresql://guardrail:postgres_ci_password_123@127.0.0.1:5432/guardrail"

      - name: Wait for Drift Monitor
        run: |
          echo "Waiting for drift-monitor service to be healthy..."
          for i in $(seq 1 30); do
            if docker compose exec -T guardrail-mesh-drift python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()" 2>/dev/null; then
              echo "[OK] Drift monitor is healthy (attempt $i/30)"
              exit 0
            fi
            echo "Attempt $i/30: drift-monitor not ready, retrying in 2s..."
            sleep 2
          done
          echo "❌ ERROR: Drift monitor failed to become ready within 60s."
          docker compose ps -a
          docker compose logs --no-color guardrail-mesh-drift
          container_id="$(docker compose ps -q guardrail-mesh-drift)"
          if [ -n "$container_id" ]; then
            docker inspect "$container_id" \
              --format='exit={{.State.ExitCode}} error={{.State.Error}}'
          fi
          exit 1

      - name: Wait for Web Container
        run: |
          echo "Waiting for web container to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "[OK] Web container is ready (attempt $i/30)"
              exit 0
            fi
            echo "Attempt $i/30: web not ready, retrying in 2s..."
            sleep 2
          done
          echo "❌ ERROR: Web container failed to become ready within 60s."
          docker compose ps
          docker compose logs guardrail-mesh-web
          exit 1

      - name: Run Automated Swarm CI Integration Test
        run: |
          CI_RUN_ID="$(python -c 'import uuid; print(uuid.uuid4())')"
          export CI_RUN_ID
          export CI_PERSISTED_INDEX_PATH="$RUNNER_TEMP/api-persisted-index.json"
          echo "Generated CI_RUN_ID: $CI_RUN_ID"
          echo "Target API JSON output path: $CI_PERSISTED_INDEX_PATH"

          cleanup() {
            echo "Cleaning up CI fixture for run $CI_RUN_ID..."
            docker compose exec -T guardrail-mesh-db \
              psql \
              -U "${POSTGRES_USER:-guardrail}" \
              -d "${POSTGRES_DB:-guardrail}" \
              -c "DELETE FROM redteam_runs WHERE id = '$CI_RUN_ID'::uuid;" || true
          }
          trap cleanup EXIT

          echo "Inserting CI database fixture into redteam_runs..."
          docker compose exec -T guardrail-mesh-db \
            psql \
            -U "${POSTGRES_USER:-guardrail}" \
            -d "${POSTGRES_DB:-guardrail}" \
            -c "
              INSERT INTO redteam_runs (
                id,
                model_version,
                jailbreak_rate,
                fp_rate,
                safety_mean,
                safety_variance,
                max_compute_shift,
                safety_sharpe
              ) VALUES (
                '$CI_RUN_ID'::uuid,
                'gemini-2.0-flash',
                0,
                0,
                1,
                0,
                0,
                1
              );
            "

          echo "Executing Swarm CI Integration Test..."
          python scripts/ci_test_swarm.py

          echo "Exporting persisted record from PostgreSQL to JSON..."
          docker compose exec -T guardrail-mesh-db \
            psql \
            -U "${POSTGRES_USER:-guardrail}" \
            -d "${POSTGRES_DB:-guardrail}" \
            -t -A \
            -c "
              SELECT json_build_object(
                'score', sovereign_score,
                'status', compliance_status,
                'breakdown', json_build_object(
                  'robustness', robustness_subscore,
                  'privacy', privacy_subscore,
                  'fuzzing', fuzzing_subscore
                )
              )
              FROM redteam_runs
              WHERE id = '$CI_RUN_ID'::uuid;
            " > "$RUNNER_TEMP/db-persisted-index.json"

          echo "Comparing API persistedIndex JSON with Database JSON record..."
          python -c "
          import json, sys

          api_file = '$CI_PERSISTED_INDEX_PATH'
          db_file = '$RUNNER_TEMP/db-persisted-index.json'

          with open(api_file, 'r', encoding='utf-8') as f:
              api_data = json.load(f)

          with open(db_file, 'r', encoding='utf-8') as f:
              db_raw = f.read().strip()

          if not db_raw:
              print('❌ ERROR: Database query returned no rows for run $CI_RUN_ID')
              sys.exit(1)

          db_data = json.loads(db_raw)

          def check_nulls(obj, path=''):
              if obj is None:
                  print(f'❌ ERROR: Field \"{path}\" is null in database record')
                  sys.exit(1)
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      check_nulls(v, f'{path}.{k}' if path else k)

          check_nulls(db_data)

          if api_data.get('status') != db_data.get('status'):
              print(f\"❌ ERROR: Mismatch in field 'status': API={api_data.get('status')} vs DB={db_data.get('status')}\")
              sys.exit(1)

          if api_data.get('score') != db_data.get('score'):
              print(f\"❌ ERROR: Mismatch in field 'score': API={api_data.get('score')} vs DB={db_data.get('score')}\")
              sys.exit(1)

          api_bd = api_data.get('breakdown', {})
          db_bd = db_data.get('breakdown', {})
          for key in ['robustness', 'privacy', 'fuzzing']:
              v_api = api_bd.get(key)
              v_db = db_bd.get(key)
              if v_api is None or v_db is None or abs(float(v_api) - float(v_db)) > 1e-5:
                  print(f\"❌ ERROR: Mismatch in field 'breakdown.{key}': API={v_api} vs DB={v_db}\")
                  sys.exit(1)

          print('[OK] Database record matches API persistedIndex response perfectly.')
          "

      - name: Print Docker Logs on Failure
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          container_id="$(docker compose ps -q guardrail-mesh-drift)"
          if [ -n "$container_id" ]; then
            docker inspect "$container_id" \
              --format='exit={{.State.ExitCode}} error={{.State.Error}}'
          fi
