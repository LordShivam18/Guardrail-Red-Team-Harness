name: Guardrail Mesh Security Gate

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  MESH_CI_VOLUME: "50"
  MESH_CI_MODEL: "gemini-2.0-flash"

jobs:
  mesh-security-gate:
    name: "Mesh Adversarial Evaluation"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Start application server
        run: |
          npm run start &
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|308"; then
              echo "Server is ready."
              break
            fi
            echo "Attempt $i/30 — server not ready, waiting 2s..."
            sleep 2
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACTIVE_JUDGE_PROVIDER: ${{ vars.ACTIVE_JUDGE_PROVIDER || 'gemini-native' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2:1.5b' }}

      - name: Run Mesh CI Security Gate
        run: |
          npx tsx scripts/ci-runner.ts \
            --model "${{ env.MESH_CI_MODEL }}" \
            --volume "${{ env.MESH_CI_VOLUME }}" \
            --base-url http://localhost:3000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload CI runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-ci-logs
          path: |
            .next/server/**/*.log
          retention-days: 14
